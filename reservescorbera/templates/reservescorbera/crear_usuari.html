<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Usuari - Esports Corbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: 'Inter', sans-serif; }
        .card-custom { 
            background-color: #1a1a1a; 
            border: 1px solid #d4af37; 
            border-radius: 15px; 
            margin-top: 50px; 
            padding: 30px; 
        }
        .form-label { color: #d4af37; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .form-control, .form-select { background-color: #222; border: 1px solid #444; color: white; }
        .form-control:focus, .form-select:focus { background-color: #2a2a2a; border-color: #d4af37; color: white; box-shadow: none; }
        .btn-add { background-color: #d4af37; color: black; font-weight: 800; border: none; }
        option { background-color: #1a1a1a; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card-custom shadow">
                    <h2 class="text-center mb-4" style="color: #d4af37; font-weight: 800;">ALTA NOU USUARI</h2>
                    <hr style="border-color: #333;">
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Tipus d'Usuari</label>
                            <select name="tipus" class="form-select" required>
                                <option value="entitat" selected>Entitat (Club, Associació...)</option>
                                <option value="admin">Tècnic/a</option>
                                <option value="conserge">Conserge</option>
                            </select>
                            <div class="form-text text-muted small mt-1">E.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nom d'Usuari</label>
                            <input type="text" name="username" class="form-control" placeholder="Ex: pavello_corbera" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correu Electrònic</label>
                            <input type="email" name="email" class="form-control" placeholder="correu@entitat.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contrasenya</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-add">CREAR USUARI</button>
                            <a href="{% url 'gestionar_reserves' %}#config" class="btn btn-outline-light btn-sm">Cancel·lar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
