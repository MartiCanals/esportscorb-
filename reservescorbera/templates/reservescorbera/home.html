{% load static %}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsportsCorb - Calendari Públic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --bg: #fdfdfd;
            --border: #eeeeee;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--primary); margin: 0; }

        /* Top Bar Estricta */
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 40px; background: var(--primary); color: white;
        }
        #top-bar h1 { margin: 0; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        #top-bar h1 span { color: var(--accent); }
        .btn-staff { border: 1px solid var(--accent); color: var(--accent); padding: 6px 15px; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: bold; }

        /* Estructura Principal */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 55px);
        }

        /* Columna de Control (Esquerra) */
        .sidebar {
            background: white;
            border-right: 1px solid var(--border);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .sidebar h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
        .sidebar p { font-size: 0.9rem; color: #777; line-height: 1.4; }

        .custom-select {
            width: 100%; padding: 12px; border: 2px solid var(--primary);
            border-radius: 8px; font-weight: 700; outline: none; cursor: pointer;
        }

        /* Contenidor de la Imatge INTEGRAT */
        #photo-container {
            margin-top: auto; 
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
            display: none; 
            border: 1px solid var(--border);
            position: relative;
        }

        #photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .photo-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white; padding: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }

        /* Àrea del Calendari */
        .calendar-area { padding: 30px; background: #fff; }
        #calendar { height: 100%; }

        /* Ajustos FullCalendar */
        .fc { --fc-border-color: #f0f0f0; }
        .fc-toolbar-title { font-weight: 800 !important; font-size: 1.3rem !important; text-transform: lowercase; }
        .fc-toolbar-title::first-letter { text-transform: uppercase; }
        .fc-button-primary { background: #fff !important; border: 1px solid #ddd !important; color: var(--primary) !important; font-weight: 700 !important; }
        .fc-button-active { background: var(--primary) !important; color: #fff !important; border-color: var(--primary) !important; }
        .fc-col-header-cell { background: #fafafa; padding: 10px 0 !important; font-size: 0.75rem; text-transform: uppercase; color: #999; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
            #photo-container { display: none !important; } 
        }
    </style>
</head>
<body>

    <nav id="top-bar">
        <h1>Esports<span>Corb</span></h1>
        <a href="{% url 'login' %}" class="btn-staff">ACCÉS ENTITATS</a>
    </nav>

    <div class="main-layout">
        <aside class="sidebar">
            <div>
                <h2>Instal·lacions</h2>
                <p>Consulta les diverses activitats, partits i entrenaments que es realitzen a les nostres instal·lacions.</p>
            </div>

            <div class="filter-box">
                <select class="custom-select" id="selector-instalacio" onchange="actualitzarTot(this)">
                    <option value="tots">Totes les instal·lacions</option>
                    {% for inst in instalacions %}
                        <option value="{{ inst.nom|lower }}" data-img="{{ inst.imatge.url|default:'' }}">
                            {{ inst.nom }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div id="photo-container">
                <img id="inst-photo" src="" alt="">
                <div class="photo-label" id="photo-name"></div>
            </div>
        </aside>

        <main class="calendar-area">
            <div id='calendar'></div>
        </main>
    </div>

    <script>
        let calendar;
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'ca',
                firstDay: 1,
                height: '100%',
                allDaySlot: false,
                slotMinTime: '00:00:00',
                slotMaxTime: '24:00:00',
                scrollTime: '08:00:00',
                headerToolbar: { 
                    left: 'prev,next today', 
                    center: 'title', 
                    right: 'dayGridMonth,timeGridWeek,timeGridDay' 
                },
                buttonText: { today: 'Avui', month: 'Mes', week: 'Setmana', day: 'Dia' },
                // Aquestes opcions permeten que el títol canviï segons la vista seleccionada
                views: {
                    dayGridMonth: { titleFormat: { month: 'long', year: 'numeric' } },
                    timeGridWeek: { titleFormat: { day: 'numeric', month: 'long', year: 'numeric' } },
                    timeGridDay: { titleFormat: { day: 'numeric', month: 'long', year: 'numeric' } }
                },
                events: '/api/reserves/',
                eventClick: function(info) {
                    Swal.fire({
                        title: info.event.extendedProps.instalacio,
                        text: info.event.title,
                        confirmButtonColor: '#1a1a1a'
                    });
                }
            });
            calendar.render();
        });

        function actualitzarTot(select) {
            const val = select.value;
            const opt = select.options[select.selectedIndex];
            const container = document.getElementById('photo-container');
            const img = document.getElementById('inst-photo');
            const label = document.getElementById('photo-name');

            if (val === 'tots') {
                container.style.display = 'none';
            } else {
                container.style.display = 'block';
                img.src = opt.getAttribute('data-img');
                label.innerText = opt.text;
            }

            const cerca = val.toLowerCase().trim();
            calendar.getEvents().forEach(ev => {
                const nom = (ev.extendedProps.instalacio || "").toLowerCase().trim();
                ev.setProp('display', (cerca === 'tots' || nom.includes(cerca)) ? 'auto' : 'none');
            });
        }
    </script>
</body>
</html>
