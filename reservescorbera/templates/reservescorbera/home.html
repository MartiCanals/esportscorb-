{% load static %}
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsportsCorb - Calendari Públic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --bg: #fdfdfd;
            --border: #eeeeee;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--primary); margin: 0; }

        /* Top Bar */
        #top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 40px; background: var(--primary); color: white;
        }
        #top-bar h1 { margin: 0; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        #top-bar h1 span { color: var(--accent); }
        .btn-staff { border: 1px solid var(--accent); color: var(--accent); padding: 6px 15px; border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: bold; }

        /* Estructura Principal */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 55px);
        }

        /* Sidebar */
        .sidebar {
            background: white; border-right: 1px solid var(--border);
            padding: 40px 30px; display: flex; flex-direction: column; gap: 30px;
        }

        .sidebar h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
        .sidebar p { font-size: 0.9rem; color: #777; line-height: 1.4; }

        .custom-select {
            width: 100%; padding: 12px; border: 2px solid var(--primary);
            border-radius: 8px; font-weight: 700; outline: none; cursor: pointer;
        }

        /* Contenidor de la Imatge (Protegit contra ValueError) */
        #photo-container {
            margin-top: auto; width: 100%; height: 200px;
            border-radius: 12px; overflow: hidden; background: #222;
            display: none; border: 1px solid var(--border); position: relative;
        }

        #photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        #no-photo-placeholder {
            height: 100%; display: none; flex-direction: column;
            align-items: center; justify-content: center; color: #555;
        }

        .photo-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white; padding: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }

        /* Àrea del Calendari */
        .calendar-area { padding: 30px; background: #fff; }
        #calendar { height: 100%; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
            #photo-container { display: none !important; } 
        }
    </style>
</head>
<body>

    <nav id="top-bar">
        <h1>Esports<span>Corb</span></h1>
        <a href="{% url 'login' %}" class="btn-staff">ACCÉS ENTITATS</a>
    </nav>

    <div class="main-layout">
        <aside class="sidebar">
            <div>
                <h2>Instal·lacions</h2>
                <p>Consulta les activitats i entrenaments de les nostres instal·lacions.</p>
            </div>

            <div class="filter-box">
                <select id="selector-instalacio" onchange="actualitzarTot(this)">
                    <option value="tots">Totes les instal·lacions</option>
                    {% for inst in instalacions %}
                        <option value="{{ inst.id }}" data-img="...">{{ inst.nom }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="photo-container">
                <img id="inst-photo" src="" alt="" style="display: none;">
                <div id="no-photo-placeholder">
                    <i class="bi bi-building fs-1"></i>
                    <span class="mt-2 small fw-bold">SENSE FOTO</span>
                </div>
                <div class="photo-label" id="photo-name"></div>
            </div>
        </aside>

        <main class="calendar-area">
            <div id='calendar'></div>
        </main>
    </div>

    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                locale: 'ca',
                firstDay: 1,
                height: '100%',
                allDaySlot: false,
                slotMinTime: '00:00:00',
                slotMaxTime: '24:00:00',
                scrollTime: '08:00:00',
                headerToolbar: { 
                    left: 'prev,next today', 
                    center: 'title', 
                    right: 'dayGridMonth,timeGridWeek,timeGridDay' 
                },
                buttonText: { today: 'Avui', month: 'Mes', week: 'Setmana', day: 'Dia' },
                events: '/api/reserves/',

                // AQUESTA FUNCIÓ S'EXECUTA CADA COP QUE UN EVENT ES MOSTRA
                eventDidMount: function(info) {
                    const selector = document.getElementById('selector-instalacio');
                    if (!selector) return;

                    const cerca = String(selector.value).trim(); // ID seleccionat (ex: "65")

                    // 1. Si és "tots", mostrem sense mirar res més
                    if (cerca === 'tots') {
                        info.el.style.display = '';
                        return;
                    }

                    // 2. Excepcions (Avisos globals, etc.)
                    if (info.event.extendedProps.tipus === 'extra' || info.event.allDay) {
                        info.el.style.display = '';
                        return;
                    }

                    // 3. LA COMPARACIÓ (La clau de l'aposta)
                    const idInst = String(info.event.extendedProps.id_inst || "").trim();
                    const idPare = String(info.event.extendedProps.id_pare || "").trim();

                    if (idInst === cerca || idPare === cerca) {
                        info.el.style.display = ''; // Coincideix ID o Pare: MOSTRAR
                    } else {
                        info.el.style.display = 'none'; // NO coincideix: AMAGAR (Això és el que et falta!)
                    }
                },

                eventClick: function(info) {
                    Swal.fire({
                        title: info.event.extendedProps.instalacio,
                        text: info.event.title,
                        confirmButtonColor: '#1a1a1a'
                    });
                }
            });
            calendar.render();
        });

        function actualitzarTot(select) {
            // ... (el teu codi de les fotos) ...
            if (calendar) {
                calendar.render(); // Això fa que s'executi el eventDidMount
            }
        }
    </script>
</body>
</html>
